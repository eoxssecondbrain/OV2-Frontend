# Render Blueprint for Cruz.
#
# Standard (2 GB), not Starter: Starter has the SAME 512 MB as the free tier,
# and this container runs three Python processes -- the backend alone measures
# ~372 MB idle, plus two MCP bridges. Starter would OOM. See PROJECT_SOT.md 7h.
#
# Every secret is `sync: false`, i.e. set once in the Render dashboard and never
# stored in git.

services:
  - type: web
    name: cruz
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    plan: standard
    region: singapore          # closest to Delhi; change if the team is elsewhere
    branch: deploy/render
    healthCheckPath: /health

    # Holds webui.db plus uploads and cache. Without this the configuration is
    # destroyed on every deploy and restart.
    disk:
      name: cruz-data
      mountPath: /app/backend/data
      sizeGB: 2

    envVars:
      - key: WEBUI_NAME
        value: Cruz
      - key: ENV
        value: prod

      # Long random value. NOT the local dev one -- generate a fresh secret for
      # production. Changing it later signs everyone out, which is harmless.
      - key: WEBUI_SECRET_KEY
        generateValue: true

      # Set to the service's public URL after the first deploy, e.g.
      # https://cruz.onrender.com -- used for absolute links and redirects.
      - key: WEBUI_URL
        sync: false

      # Secret-bearing MCP upstreams. Paste the full SSE URLs, no angle brackets.
      - key: VAULT_MCP_URL
        sync: false
      - key: THREADS_MCP_URL
        sync: false

      # Database-backed vault, bridged on :9092 and registered as
      # server:mcp:eoxs-db. Required if any model is attached to that server --
      # without it the tools are reachable in config but dead at runtime.
      #
      # This is the FULL corpus (serverInfo eoxs-wiki-db-full). Do not point it
      # at the general endpoint -- see USERS_MCP_URL below.
      - key: DB_MCP_URL
        sync: false

      # General-scope vault: the same corpus with sensitive material removed,
      # for ordinary users. Bridged on :9093, registered as
      # server:mcp:eoxs-users.
      #
      # Must be the endpoint whose serverInfo is eoxs-wiki-db-GENERAL. It and
      # the -full endpoint above differ only in row counts -- same 20 tools,
      # same version -- so a swapped pair exposes unredacted data silently.
      # Verify with a get_index call after any change (PROJECT_SOT.md 7m).
      - key: USERS_MCP_URL
        sync: false

      # Intern-scope vault, for MBA interns. Bridged on :9094, registered as
      # server:mcp:eoxs-intern.
      #
      # Must be the endpoint whose serverInfo is eoxs-wiki-db-INTERN. Every tier
      # on that host reports the same tool names and version, so nothing about a
      # crossed pair looks broken -- it just serves the wrong scope to the wrong
      # audience. Verify with get_index after any change (PROJECT_SOT.md 7p).
      - key: INTERN_MCP_URL
        sync: false

      # HR-scope vault, for the HR function. Bridged on :9095, registered as
      # server:mcp:eoxs-hr.
      #
      # Must be the endpoint whose serverInfo is eoxs-wiki-db-HR. Unlike the
      # tiers above this one is NOT a subset of -full: it carries more wiki
      # pages (1298 vs 1048), fewer email threads, and no tickets or
      # sales_orders at all -- 17 tools rather than 20. Verify with get_index
      # after any change (PROJECT_SOT.md 7q).
      - key: HR_MCP_URL
        sync: false
